# Nginx configuratie voor Hitlijsten
# Sla op als /etc/nginx/sites-available/hitlijsten
# Activeer met: ln -s /etc/nginx/sites-available/hitlijsten /etc/nginx/sites-enabled/

# HTTP → HTTPS redirect (optioneel, als je SSL hebt)
# server {
#     listen 80;
#     server_name _;
#     return 301 https://$host$request_uri;
# }

# Catch-all: vangt ALLE domeinen op die naar dit IP wijzen.
# Voor elk nieuw domein hoef je NIETS aan Nginx te wijzigen —
# het domein in de database bepaalt naar welke lijst doorgestuurd wordt.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # catch-all: elk domein dat naar dit IP wijst
    server_name _;

    # Vergroot de upload limiet voor achtergrondafbeeldingen
    client_max_body_size 15M;

    # Proxy alles naar de Node.js app
    location / {
        proxy_pass         http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
