# Hitlijsten - Nginx configuratie (na Let's Encrypt)

# 1. HTTP catch-all: overige domeinen / nieuwe domeinen zonder cert
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 15M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass         http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# 2. HTTP -> HTTPS redirect voor de 4 bekende domeinen
server {
    listen 80;
    listen [::]:80;
    server_name utregsetop100.nl    www.utregsetop100.nl
                utrechtsetop100.nl  www.utrechtsetop100.nl
                lijstvanjeleven.nl  www.lijstvanjeleven.nl
                vijfvanjouwbedrijf.nl www.vijfvanjouwbedrijf.nl;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 3. HTTPS voor de 4 bekende domeinen — proxy naar Node.js
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name utregsetop100.nl    www.utregsetop100.nl
                utrechtsetop100.nl  www.utrechtsetop100.nl
                lijstvanjeleven.nl  www.lijstvanjeleven.nl
                vijfvanjouwbedrijf.nl www.vijfvanjouwbedrijf.nl;

    ssl_certificate     /etc/letsencrypt/live/utregsetop100.nl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/utregsetop100.nl/privkey.pem;  # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;              # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                   # managed by Certbot

    client_max_body_size 15M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass         http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
