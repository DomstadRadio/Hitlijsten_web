# Hitlijsten - Nginx configuratie (na Let's Encrypt)

# Herbruikbaar proxy-blok
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. HTTP catch-all: overige domeinen / nieuwe domeinen zonder cert
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 15M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass         http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# 2. HTTP -> HTTPS redirect voor de 4 bekende domeinen
server {
    listen 80;
    listen [::]:80;
    server_name utregsetop100.nl    www.utregsetop100.nl
                utrechtsetop100.nl  www.utrechtsetop100.nl
                lijstvanjeleven.nl  www.lijstvanjeleven.nl
                vijfvanjouwbedrijf.nl www.vijfvanjouwbedrijf.nl
                hitlijsten.domstadradio.nl;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 4. HTTPS voor hitlijsten.domstadradio.nl
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hitlijsten.domstadradio.nl;

    ssl_certificate     /etc/letsencrypt/live/hitlijsten.domstadradio.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hitlijsten.domstadradio.nl/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 15M;

    location / {
        proxy_pass         http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# 3. HTTPS voor de 4 bekende domeinen
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name utregsetop100.nl    www.utregsetop100.nl
                utrechtsetop100.nl  www.utrechtsetop100.nl
                lijstvanjeleven.nl  www.lijstvanjeleven.nl
                vijfvanjouwbedrijf.nl www.vijfvanjouwbedrijf.nl;

    ssl_certificate     /etc/letsencrypt/live/utregsetop100.nl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/utregsetop100.nl/privkey.pem;  # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;              # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                   # managed by Certbot

    client_max_body_size 15M;

    # Gzip compressie (halveert typisch de JS-bundelgrootte op de wire)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # React static assets (content-hashed bestandsnamen) — voor altijd cachen
    location /static/ {
        alias /opt/hitlijsten/frontend/build/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        gzip_static on;
    }

    # Overige statische bestanden uit de frontend build (favicon, manifest, robots)
    location ~* \.(ico|png|webmanifest|txt|svg)$ {
        root /opt/hitlijsten/frontend/build;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri @nodejs;
    }

    # API → altijd naar Node.js
    location /api/ {
        proxy_pass         http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Uploads (afbeeldingen)
    location /uploads/ {
        proxy_pass         http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_read_timeout 30s;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Alles overige (SPA + domeindirect) → Node.js
    location / {
        proxy_pass         http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Fallback voor statische bestanden die niet in de build staan
    location @nodejs {
        proxy_pass         http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_read_timeout 30s;
    }
}
